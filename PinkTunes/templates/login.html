{% extends "base.html" %}
{% block title %}Entrar — PinkTunes{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-decoration"><span class="big-note">♫</span><p>Seu universo musical<br>espera por você.</p></div>
  <form class="form-card" method="post">
    <span class="eyebrow">BEM-VINDA(O) DE VOLTA</span><h1>Entrar na conta</h1><p class="muted">Continue de onde sua música parou.</p>
    <label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="voce@email.com">
    <label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Sua senha">
    <button class="btn primary full" type="submit">Entrar</button>
    <p class="form-foot">Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a></p>
  </form>
</section>
{% endblock %}
