{% extends "base.html" %}
{% block title %}Criar conta — PinkTunes{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-decoration"><span class="big-note">♪</span><p>Uma biblioteca<br>com a sua cara.</p></div>
  <form class="form-card" method="post">
    <span class="eyebrow">COMECE SUA COLEÇÃO</span><h1>Criar conta</h1><p class="muted">Leva só um minutinho.</p>
    <label for="name">Seu nome</label><input id="name" name="name" required maxlength="80" autocomplete="name" placeholder="Como podemos te chamar?">
    <label for="email">E-mail</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="voce@email.com">
    <label for="password">Senha</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="Pelo menos 8 caracteres">
    <button class="btn primary full" type="submit">Criar minha conta</button>
    <p class="form-foot">Já tem uma conta? <a href="{{ url_for('login') }}">Entrar</a></p>
  </form>
</section>
{% endblock %}
